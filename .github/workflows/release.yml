name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: WiX Toolset (v5 + extensões UI/Util, como packaging/windows/package.ps1 espera)
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
      - name: Build e pacote (MSI per-machine + portable zip)
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/release/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-dev
      - name: Build release
        run: cargo build --release --bin local-utils
      - name: Package
        run: |
          set -euo pipefail
          export APPIMAGE_EXTRACT_AND_RUN=1
          mkdir -p out
          version=$(grep '^version =' Cargo.toml | head -1 | sed 's/.*= "\([^"]*\)".*/\1/')
          appdir="AppDir-local-utils"
          mkdir -p "$appdir/usr/bin"
          cp "target/release/local-utils" "$appdir/usr/bin/"
          cp "icons/icon.png" "$appdir/local-utils.png"
          printf '[Desktop Entry]\nType=Application\nName=Local Utils\nExec=local-utils\nIcon=local-utils\nCategories=Utility;\nComment=Utilitários do cotidiano 100%% locais e offline\nTerminal=false\nStartupWMClass=local-utils\n' > "$appdir/local-utils.desktop"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir "$appdir" \
            --desktop-file "$appdir/local-utils.desktop" \
            --icon-file "$appdir/local-utils.png" --output appimage
          ls -la *.AppImage 2>/dev/null || true
          # Nomes no padrão da suíte, que o updater (craft_update) parseia:
          # <app>-<version>-<os>-<arch>.<ext>. O Name/Desktop entry tem espaço
          # ("Local Utils"), então o linuxdeploy batiza o arquivo com
          # underscore (Local_Utils-x86_64.AppImage) — esperado.
          if ls Local?Utils*.AppImage 1>/dev/null 2>&1; then
            mv Local?Utils*.AppImage "out/local-utils-$version-linux-x86_64.AppImage"
          fi
          tar -czf "out/local-utils-$version-linux-x86_64.tar.gz" -C "target/release" local-utils
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: out/
          if-no-files-found: error

  arch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Valida PKGBUILD
        run: |
          version=$(grep '^version =' Cargo.toml | head -1 | sed 's/.*= "\([^"]*\)".*/\1/')
          cat > PKGBUILD <<EOF
          pkgname=local-utils
          pkgver=$version
          pkgrel=1
          pkgdesc='Utilitários do cotidiano 100% locais e offline — clipboard na bandeja'
          arch=(x86_64)
          url='https://github.com/Anon5T4R/Local-Utils'
          license=(GPL-3.0-or-later)
          depends=(glibc gcc-libs libxcb libxrandr libxi libxcursor libxkbcommon)
          makedepends=(rust cargo)
          source=("local-utils-$pkgver.tar.gz::https://github.com/Anon5T4R/Local-Utils/archive/refs/tags/v$pkgver.tar.gz")
          sha256sums=(SKIP)
          build() {
            cd "local-utils-$pkgver"
            cargo build --release --bin local-utils
          }
          package() {
            cd "local-utils-$pkgver"
            install -Dm755 "target/release/local-utils" "$pkgdir/usr/bin/local-utils"
            install -Dm644 "icons/icon.png" "$pkgdir/usr/share/icons/hicolor/256x256/apps/local-utils.png"
            install -Dm644 "packaging/linux/local-utils.desktop" "$pkgdir/usr/share/applications/local-utils.desktop"
          }
          EOF
          namcap PKGBUILD || true
          echo "PKGBUILD gerado e validado"

  publish:
    needs: [windows, linux, arch]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Local Utils ${GITHUB_REF_NAME}" \
            --notes "Utilitários do cotidiano 100% locais e offline — clipboard na bandeja + ferramentas leves." \
            dist/windows/* dist/linux/* \
          || gh release upload "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/windows/* dist/linux/*
