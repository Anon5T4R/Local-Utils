[workspace]
resolver = "3"
members = ["xtask", "utils-ui"]
default-members = [".", "utils-ui"]
exclude = ["libs"]

# Forks vendored (egui 6d518fc, winit a517b38) — receita no AGENTS.md do local-office.
[patch.crates-io]
ecolor = { path = "libs/egui/crates/ecolor/" }
emath = { path = "libs/egui/crates/emath/" }
epaint = { path = "libs/egui/crates/epaint/" }
epaint_default_fonts = { path = "libs/egui/crates/epaint_default_fonts/" }
egui = { path = "libs/egui/crates/egui/" }
egui-winit = { path = "libs/egui/crates/egui-winit/" }
egui-wgpu = { path = "libs/egui/crates/egui-wgpu/" }
egui_glow = { path = "libs/egui/crates/egui_glow/" }
egui_extras = { path = "libs/egui/crates/egui_extras/" }
egui_kittest = { path = "libs/egui/crates/egui_kittest/" }
egui_system_font_provider = { path = "libs/egui/crates/egui_system_font_provider/" }
eframe = { path = "libs/egui/crates/eframe/" }
egui_demo_lib = { path = "libs/egui/crates/egui_demo_lib/" }
egui_inspection = { path = "libs/egui/crates/egui_inspection/" }
winit = { path = "libs/winit/" }
# // local-utils: fork do rustls-rustcrypto (experimento TLS puro do updater).
# O upstream 0.0.2-alpha puxa rustls-webpki 0.102 só pelas constantes `alg_id`;
# o fork usa `rustls-pki-types` e some com os advisories (README no próprio fork).
rustls-rustcrypto = { path = "libs/rustls-rustcrypto" }

[package]
name = "local-utils"
version = "0.6.8"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/Anon5T4R/Local-Utils"
description = "Utilitários do cotidiano 100% locais e offline — clipboard na bandeja + ferramentas leves"

[build-dependencies]
# Embute o ícone no .exe (Windows) — sem isso o Explorer mostra ícone genérico.
winresource = "0.1"

[dependencies]
eframe = "0.37"
# `monochrome_emoji_fonts`: embute Noto Emoji + emoji-icon — sem ela os glifos
# de UI (★ 🗑 ✏ 📋) viram tofu: as fontes default (Hack/Ubuntu) não os têm.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
image = "0.25"
utils-ui = { path = "utils-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Hash das ferramentas de dev (`tools_dev.rs`): SHA-256 e MD5 do RustCrypto.
# O `sha2` 0.10 já vinha no grafo de forma transitiva (craft-update/ureq) — só
# vira aresta direta. O `md-5` 0.10 é a MESMA família (`digest` 0.10, que já
# está no lock): nenhuma crate nova além dele entra por causa disto.
sha2 = "0.10"
md-5 = "0.10"
# Atualização: craft_update (libs/craft-libs) — check no GitHub, prompt egui e
# self-update (Windows: MSI/portable; Linux: AppImage/tar.gz). O `egui` liga o
# prompt e o Updater de UI.
craft-update = { path = "libs/craft-libs/crates/update", features = ["egui", "icons"] }
# Seletor NATIVO de arquivo/pasta. Defaults do rfd 0.17 no Linux = backend
# XDG portal (Rust puro via zbus, fallback Zenity) — mesmo padrão dos apps
# maduros (local-pdf e irmãos); chamadas via AsyncFileDialog + thread worker
# (src/pickers.rs, molde do local-pdf). Windows segue o diálogo nativo.
rfd = "0.17"
# Espera o seletor nativo fora da thread de UI (já no grafo via wgpu).
pollster = "1.0"
# QR do item do clipboard: só a MATRIZ (o app desenha os módulos no painter) —
# a feature `image` do crate reaproveita o `image 0.25` que já está no grafo,
# nenhuma crate nova entra por causa disso.
qrcode = "0.14"
# Texto das anotações da captura (`shot_editor.rs`): a `image` não rasteriza
# fonte nenhuma. `ab_glyph` é puro Rust (sem freetype/fontconfig), Apache-2.0/MIT,
# e desenha glifo a glifo com cobertura — dá contorno e alpha blend na mão.
# A fonte é a Ubuntu-Light que o epaint já embute (`libs/egui/...`).
ab_glyph = "0.2"
# JPEG XL como ORIGEM do conversor (`convert.rs`): o `jxl-oxide` é um
# decodificador puro Rust — NÃO existe encoder JXL maduro em Rust, então o JXL
# nunca aparece como destino na UI. 0.12 = a versão que o local-paint já usa
# (registrada no local-deps); a feature `image` liga o `JxlDecoder`, que
# implementa `image::ImageDecoder`. O `bytemuck` que ela pede já está no grafo
# pelo próprio `image`, e o `image` 0.25 dela casa com o nosso (0.25.x).
jxl-oxide = { version = "0.12", features = ["image"] }
# Monitor da aba Sistema (`system.rs`): CPU, memória, discos, rede, uptime,
# processos e componentes de temperatura. MIT, 100% local (nada de rede). 0.40
# é a estável atual e — decisivo — depende de `windows >=0.62,<0.63`: usa a
# MESMA instância da crate `windows` que este app já tem (0.62), sem duplicar
# o grafo (duas instâncias quebrariam o dx12 do wgpu-hal). A 0.33 ainda pedia
# `windows 0.54..=0.57`, o que traria uma segunda instância.
# `default-features = false`: sobram só as quatro leituras que a aba usa —
# "user" (conta do SO) e "multithread" (puxaria rayon) ficam fora do grafo.
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network", "component"] }

[target.'cfg(windows)'.dependencies]
# Leitura/escrita do CONTEÚDO do clipboard (texto, HTML, RTF, arquivos e
# imagem) — mesma crate que o local-keys usa; já vinha no grafo pelo arboard.
clipboard-win = "5.4"
# Bandeja: MESMA crate/versão do local-keys (tray-icon 0.24). Só no Windows —
# no Linux o tray-icon puxaria muda→gtk3 pra dentro do AppImage.
tray-icon = "0.24"
# Atalho global (Win+Alt+V): registra no SO e entrega WM_HOTKEY numa thread
# própria. 0.8 = última estável; usa windows-sys 0.59, que já estava no grafo.
global-hotkey = "0.8"
# Captura de tela (`capture.rs`): cada monitor vira um `RgbaImage` congelado que
# o overlay de seleção desenha. MESMA versão pinada do local-paint (=0.9.8, já
# registrada no local-deps) — ela usa `windows 0.62` e `image 0.25`, as duas que
# este app já tem, então não entra instância duplicada de nenhuma das duas.
xcap = "=0.9.8"
# Autostart: HKCU\Software\Microsoft\Windows\CurrentVersion\Run — mesma crate
# (e versão) que o craft-update já puxa de forma transitiva.
winreg = "0.55"
# Abrir a página da release ("Download" do prompt do updater) — mesmo caminho
# do local-keys (ShellExecuteW, sem dep extra de shell). 0.62 = a mesma
# versão que wgpu/gpu-allocator já puxam: única instância de `windows` no
# grafo (duas quebram o dx12 do wgpu-hal).
# Features novas (monitor do clipboard, `clipboard.rs`): DataExchange
# (AddClipboardFormatListener/GetClipboardSequenceNumber), Threading
# (OpenProcess/QueryFullProcessImageNameW da exclusão de apps sensíveis),
# LibraryLoader (GetModuleHandleW da classe da janela), Graphics_Gdi (o
# WNDCLASSW só existe com essa feature) e SystemInformation (GetLocalTime dos
# carimbos relativos da lista). WindowsAndMessaging cobre também o winctl
# (ShowWindow/EnumWindows/GetMessageW da bandeja e do atalho global).
# Input_KeyboardAndMouse: GetAsyncKeyState (a captura do atalho nas opções
# pergunta ao SO se o Win está pressionado — o egui não expõe o Super) e o
# SendInput do "colar direto" (`paste.rs`).
# OCR nativo (`ocr.rs`): Media_Ocr (Windows.Media.Ocr), Graphics_Imaging
# (SoftwareBitmap do motor) e Storage_Streams (DataWriter monta o IBuffer do
# RGBA). WinRT (RoInitialize) porque o motor exige apartamento COM na thread
# que chama — a leitura roda numa thread própria.
# System_Power: GetSystemPowerStatus (bateria da aba Sistema) — um P/Invoke,
# sem crate nova.
# Media_Audio: PlaySoundW do alarme do relógio (`alarm_sound.rs`) — loop do
# .wav do usuário e o stop (`PlaySoundW(null)`).
# System_Diagnostics_Debug: MessageBeep (fallback de 3 bipes sem arquivo).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
